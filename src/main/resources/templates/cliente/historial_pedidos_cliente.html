<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de Pedidos</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">
    <link rel="stylesheet" th:href="@{css/cliente/historial_pedidos_cliente.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/pie_pagina.css}">
</head>
<body>

<header class="header">
    <div class="header-top">
        <div class="logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo Eggs Gold">
        </div>

        <div class="header-title">
            <h1>Consulta tus Pedidos</h1>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="header-actions" id="navMenu">
            <button class="nav-item btn-novedad" id="btnNovedad">
                <span>Reportar Novedad</span>
            </button>
            <a th:href="@{/inicio_cliente}" class="nav-item btn-regresar">
                <span>Regresar</span>
            </a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="tabs">
        <div class="tab active" data-tab="all">Todos</div>
        <div class="tab" data-tab="entregado">Entregados</div>
        <div class="tab" data-tab="entrega">En Camino</div>
        <div class="tab" data-tab="alistamiento">Alistamiento</div>
    </div>

    <section class="orders-section active" id="all-orders">
        <div class="orders-grid" id="orders-container-all"></div>
    </section>

    <section class="orders-section" id="entregado-orders">
        <div class="orders-grid" id="orders-container-delivered"></div>
    </section>

    <section class="orders-section" id="entrega-orders">
        <div class="orders-grid" id="orders-container-shipping"></div>
    </section>

    <section class="orders-section" id="alistamiento-orders">
        <div class="orders-grid" id="orders-container-alistamiento"></div>
    </section>
</div>

<div class="modal" id="novedadModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Reportar Novedad</h2>
            <button class="close-modal" id="closeModal">&times;</button>
        </div>
        <form id="novedadForm">
            <div class="form-group">
                <label for="orderNumber">Código de Pedido</label>
                <input type="number" id="orderNumber" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="tipoNovedad">Tipo de Novedad</label>
                <select id="tipoNovedad" class="form-control" required>
                    <option value="">Seleccione un tipo</option>
                    <option value="PEDIDO_INCOMPLETO">Pedido Incompleto</option>
                    <option value="PEDIDO_EN_MAL_ESTADO">Pedido en Mal Estado</option>
                    <option value="OTRO">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" class="form-control" placeholder="Describa la novedad en detalle..." required></textarea>
            </div>

            <div class="form-group">
                <label for="evidencia">Evidencia (opcional)</label>
                <input type="file" id="evidencia" class="form-control" accept="image/*">
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelNovedad">Cancelar</button>
                <button type="submit" class="btn btn-primary">Enviar Novedad</button>
            </div>
        </form>
    </div>
</div>

<div class="modal" id="facturaModal">
    <div class="modal-content modal-factura">
        <div class="modal-header">
            <h2>Factura</h2>
            <button class="close-modal" id="closeFacturaModal">&times;</button>
        </div>

        <div id="facturaContent" class="factura-content">
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="closeFacturaBtn">Cerrar</button>
            <button type="button" class="btn btn-primary" id="downloadFacturaBtn">
                Descargar PDF
            </button>
        </div>
    </div>
</div>

<footer>
    <div class="footer-container">
        <div class="footer-logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo" width="90">
        </div>

        <div class="footer-section">
            <h2>CONTÁCTANOS</h2>
            <a href="https://web.whatsapp.com/" target="_blank">3126204260</a>
            <a href="https://web.whatsapp.com/" target="_blank">3216942598</a>
        </div>

        <div class="footer-section">
            <h2>INFO SITIO</h2>
            <a href="#">Política de la Empresa</a>
        </div>

        <div class="footer-section">
            <h2>SÍGUENOS</h2>
            <div class="social-icons">
                <a href="https://es-la.facebook.com/index.php/" target="_blank">
                    <img th:src="@{/imagenes/inicio/facebook.jpg}" alt="Facebook" width="28">
                </a>
                <a href="https://www.instagram.com/" target="_blank">
                    <img th:src="@{/imagenes/inicio/instagram.jpg}" alt="Instagram" width="32">
                </a>
                <a href="https://www.youtube.com/" target="_blank">
                    <img th:src="@{/imagenes/inicio/youtube.jpg}" alt="YouTube" width="32">
                </a>
            </div>
        </div>
    </div>
</footer>

<script th:src="@{js/cliente/historial_pedidos_cliente.js}"></script>
<script th:src="@{/js/utils/manejo_sesion.js}"></script>

<script th:src="@{/js/utils/validacion_rol.js}"></script>
<script th:src="@{/js/utils/reportar_novedad.js}"></script>

<script th:src="@{/js/cliente/menu_hamburguesa.js}"></script>
<script> validarRolPagina('CLIENTE'); </script>

</body>
</html>
