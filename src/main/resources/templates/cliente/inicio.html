<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Enlace al archivo CSS personalizado -->
    <link rel="stylesheet" href="css/cliente/cliente.css">
    <link rel="stylesheet" href="css/inicio/pie_pagina.css">
    <link rel="stylesheet" href="css/inicio/inicio.css">
    <!-- Enlace al favicon (ícono de la pestaña) -->
    <link rel="icon" type="image/jpg" href="imagenes/LOGO.jpg">
    <title>EGGS GOLD - Inventario</title>
</head>
<body>
<!-- ========== ENCABEZADO (HEADER) ========== -->
<header>
    <!-- Contenedor principal del encabezado -->
    <div class="header-contenedor">
        <!-- Logo y título de la empresa -->
        <div class="logo-titulo">
            <img src="imagenes/LOGO.jpg" alt="logo" width="50" height="50" />
            <span class="texto">EGGS GOLD</span>
        </div>

        <!-- Contenedor de búsqueda y usuario -->
        <div class="busqueda-usuario">
            <!-- Barra de búsqueda de productos -->
            <div class="barra-busqueda">
                <input type="text" id="buscador-productos" placeholder="Buscar productos..." />
                <button type="submit">🔍 Buscar</button>
            </div>

            <!-- Contenedor para carrito y perfil -->
            <div class="carrito-perfil">
                <!-- Carrito de compras con contador -->
                <div class="carro7">
                    <a th:href="@{/carrito}">
                        <img th:src="@{/imagenes/inicio/carrito_compras.png}" width="20" height="20"/>
                        Carrito/
                        <!-- Contador de productos en el carrito -->
                        <span id="contador-carrito">0</span>
                    </a>
                </div>

                <!-- PERFIL (solo visible si el usuario está logueado) -->
                <div class="perfil-contenedor"
                     th:if="${cliente != null}">
                    <!-- Círculo con iniciales del cliente -->
                    <div class="perfil-circulo"
                         th:text="${#strings.substring(cliente.nombre, 0, 1).toUpperCase()} + ${#strings.substring(cliente.apellido, 0, 1).toUpperCase()}">
                        YA
                    </div>

                    <!-- Nombre del cliente con flecha desplegable -->
                    <div class="perfil-nombre">
                        <span th:text="${cliente.nombre + ' ' + cliente.apellido}">Nombre</span>
                        <span class="flecha-abajo"></span>
                    </div>

                    <!-- Menú desplegable del perfil -->
                    <div class="perfil-menu" id="perfil-menu">
                        <a th:href="@{/perfil}">Mi Perfil</a>
                        <a th:href="@{/pedidos}">Mis Pedidos</a>
                        <a th:href="@{/logout}">Cerrar sesión</a>
                    </div>
                </div>

                <!-- SI NO ESTÁ LOGUEADO (mostrar enlaces de registro e inicio de sesión) -->
                <div class="login-registro-links" th:if="${cliente == null}">
                    <a th:href="@{/registro}" class="nav-link">REGISTRARSE</a>
                    <a th:href="@{/login}" class="nav-link">INICIAR SESIÓN</a>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- ========== CONTENIDO PRINCIPAL ========== -->
<main>
    <!-- Sección de productos en inventario -->
    <section class="seccion-productos">
        <h2 class="titulo-seccion">NUESTROS PRODUCTOS</h2>
        <!-- Contenedor donde se cargarán los productos dinámicamente -->
        <div class="productos" id="productos-container">
            <!-- Los productos se cargarán aquí mediante JavaScript -->
        </div>
    </section>
</main>

<!-- ========== PIE DE PÁGINA (FOOTER) ========== -->
<footer>
    <div class="footer-container">
        <!-- Logo del footer -->
        <div class="footer-logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo" width="90">
        </div>

        <!-- Sección de contacto -->
        <div class="footer-section">
            <h2>CONTÁCTANOS</h2>
            <a href="https://web.whatsapp.com/" target="_blank">3126204260</a>
            <a href="https://web.whatsapp.com/" target="_blank">3216942598</a>
        </div>

        <!-- Sección de información del sitio -->
        <div class="footer-section">
            <h2>INFO SITIO</h2>
            <a href="#">Política de la Empresa</a>
            <a href="#">Política de Privacidad</a>
            <a href="#">Socios</a>
        </div>

        <!-- Sección de redes sociales -->
        <div class="footer-section">
            <h2>SÍGUENOS</h2>
            <div class="social-icons">
                <a href="https://es-la.facebook.com/index.php/" target="_blank">
                    <img th:src="@{/imagenes/inicio/facebook.jpg}" alt="Facebook" width="28">
                </a>
                <a href="https://www.instagram.com/" target="_blank">
                    <img th:src="@{/imagenes/inicio/instagram.jpg}" alt="Instagram" width="32">
                </a>
                <a href="https://www.youtube.com/" target="_blank">
                    <img th:src="@{/imagenes/inicio/youtube.jpg}" alt="YouTube" width="32">
                </a>
            </div>
        </div>
    </div>
</footer>

<!-- Enlace al archivo JavaScript con la funcionalidad -->
<script src="js/cliente/cliente.js" defer></script>
<script src="js/manejo_sesion/manejo_sesion.js" defer></script>


</body>
</html>
