<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrar Logística - Eggs Gold</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/utils/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/utils/header-responsive.css}">

    <link rel="stylesheet" th:href="@{/css/registros/registro_conductor_logistica.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">
</head>
<body>

<div class="header-responsive">
    <div class="header-content">
        <div class="header-logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo Eggs Gold">
        </div>
        <h1 class="header-title">
            Registro de Logística
        </h1>
        <button class="header-hamburger" aria-label="Abrir menú">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</div>

<nav id="sidebar">
    <ul>
        <li class="perfil-admin">
            <div class="avatar-contenedor" id="avatar-contenedor">
                <span id="avatar-iniciales">AD</span>
                <img id="avatar-imagen" src="" alt="Foto de perfil" style="display: none;" />

                <label for="input-foto" class="boton-subir-foto" aria-label="Cambiar foto de perfil">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="input-foto" accept="image/*" style="display: none;" />
            </div>
            <h2>Panel de Administración</h2>
        </li>
        <li>
            <a th:href="@{/administrador_inicio}">
                <i class="fas fa-home"></i> Inicio
            </a>
        </li>
        <li>
            <a href="/logout" id="cerrar_sesion">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </a>
        </li>
    </ul>
</nav>

<main id="main-content">
    <!-- header desktop -->
    <header role="banner">
        <div class="opciones">
            <div class="marca-contenedor">
                <div class="logo">
                    <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo de Eggs Gold">
                </div>
                <div class="marca-texto">
                    <h1 class="titulo">Eggs Gold</h1>
                    <p class="subtitulo">Huevos frescos a tu puerta</p>
                </div>
            </div>
            <h1 class="titulo2">Registro de Logística</h1>
        </div>
    </header>

    <form th:action="@{/registro_logistica}" th:object="${logistica}" method="post"
          class="formulario-contenedor">

        <h2>Formulario de registro</h2>

        <div th:if="${mensaje}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${mensaje}"></span>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Carlos" required>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ej. López" required>

        <label for="numDocumento">Número de Documento:</label>
        <input type="number" id="numDocumento" th:field="*{numDocumento}" placeholder="Ej. 1022457896" required>

        <label for="direccionUsuario">Dirección:</label>
        <input type="text" id="direccionUsuario" th:field="*{direccionUsuario}" placeholder="Ej. Calle 123 #45-67" required>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" th:field="*{edad}" placeholder="Ej. 30" min="18" max="100" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" th:field="*{telefono}" placeholder="Ej. 3123456789" required>

        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" th:field="*{correo}" placeholder="Ej. logistica@eggsgold.com" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" th:field="*{password}" placeholder="Ingrese una contraseña" required>

        <button type="submit" class="btn-guardar">
            Registrar logística
        </button>
    </form>
</main>

<script th:src="@{/js/utils/sidebar.js}"></script>

<script th:src="@{/js/utils/manejo_sesion.js}"></script>
<script th:src="@{/js/utils/validacion_rol.js}"></script>
<script> validarRolPagina('ADMIN'); </script>
<script th:src="@{/js/utils/validacion_registro_usuario.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const configLogistica = {
            nombreId: 'nombre',
            apellidoId: 'apellido',
            numDocumentoId: 'numDocumento',
            direccionId: 'direccionUsuario',
            edadId: 'edad',
            telefonoId: 'telefono',
            correoId: 'correo',
            passwordId: 'password'
        };
        inicializarValidacion('.formulario-contenedor', configLogistica);
    });
</script>

</body>
</html>
