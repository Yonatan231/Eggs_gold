<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrar Conductor - Eggs Gold</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos base -->
    <link rel="stylesheet" th:href="@{/css/administrador/administrador.css}">
    <link rel="stylesheet" th:href="@{/css/registros/registro_conductor.css}">

    <!-- Favicon -->
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/LOGO.jpg}">
</head>
<body>
<!-- Sidebar -->
<nav id="sidebar">
    <ul>
        <li class="perfil-admin">
            <div class="avatar-contenedor">
                <span id="avatar-iniciales">AD</span>
            </div>
            <h2>Panel de Administración</h2>
        </li>
        <li><a th:href="@{/administrador}" class="nav-link"><i class="fas fa-home"></i> Inicio</a></li>
        <li><a href="/logout" class="nav-link"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
    </ul>
</nav>

<!-- Contenido principal -->
<main id="main-content">
    <header>
        <div class="opciones">
            <img th:src="@{/imagenes/LOGO.jpg}" alt="Logo" class="logo">
            <h1 class="titulo2"><i class="fas fa-id-card"></i> Registro de Conductor</h1>
        </div>
    </header>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/registro_conductor}" th:object="${conductor}" method="post"
          class="formulario-contenedor">

        <h2>Formulario de registro</h2>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Carlos" required>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ej. López" required>

        <label for="numDocumento">Número de Documento:</label>
        <input type="number" id="numDocumento" th:field="*{numDocumento}" placeholder="Ej. 1022457896" required>

        <label for="direccionUsuario">Dirección:</label>
        <input type="text" id="direccionUsuario" th:field="*{direccionUsuario}" placeholder="Ej. Calle 123 #45-67" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" th:field="*{telefono}" placeholder="Ej. 3123456789" required>

        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" th:field="*{correo}" placeholder="Ej. conductor@eggsgold.com" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" th:field="*{password}" placeholder="Ingrese una contraseña" required>

        <button type="submit" class="btn-guardar">
            <i class="fas fa-save"></i> Registrar Conductor
        </button>
    </form>
</main>
</body>
</html>
