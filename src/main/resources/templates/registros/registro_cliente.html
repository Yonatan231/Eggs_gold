<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Cliente - Eggs Gold</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}">
    <!-- ruta hacia el css -->
    <link rel="stylesheet" th:href="@{/css/inicio/inicio.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/pie_pagina.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/encabezado.css}">
    <link rel="stylesheet" th:href="@{/css/registros/registro_cliente.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">
</head>

<body>
<!-- encabezado -->
<header>
    <div class="marca">
        <!-- logo como imagen -->
        <div class="logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo Eggs Gold">
        </div>

        <div>
            <h1 class="titulo">Eggs Gold</h1>
            <p class="subtitulo">Huevos frescos a tu puerta</p>
        </div>
    </div>

    <!-- boton hamburguesa para menu movil solo se ve en pantallas pequenas -->
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="navMenu">
        <a th:href="@{/inicio}">Inicio</a>
        <a th:href="@{/inicio#sobre}">Sobre nosotros</a>
        <a th:href="@{/inicio#productos}">Productos</a>
        <a th:href="@{/contacto}">Contacto</a>
        <a th:href="@{/registro_cliente}" class="activo">Registrarse</a>
        <a th:href="@{/iniciar_sesion}">Iniciar Sesion</a>
        <a th:href="@{/inventario}" class="carrito">
            <img th:src="@{/imagenes/inicio/carrito_compras.png}" alt="Carrito de compras">
        </a>
    </nav>
</header>

<main>
    <!-- contenedor principal del formulario -->
    <div class="form-wrapper">
        <h2 class="titulo-registro">REGISTRO</h2>
        <!-- imagen decorativa del formulario -->
        <img th:src="@{/imagenes/registros/registro_cliente.png}" alt="Imagen de registro" class="registro-img" />

        <!-- tarjeta del formulario -->
        <div class="form-card">
            <!-- mensajes del servidor -->
            <!-- mensaje de error del servidor documento o correo duplicado -->
            <div th:if="${error}" class="mensaje-error" style="display:block; margin-bottom: 15px; padding: 10px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 5px;">
                <p th:text="${error}" style="margin: 0;"></p>
            </div>

            <!-- mensaje de exito -->
            <div th:if="${mensaje}" class="mensaje-exito" style="display:block; margin-bottom: 15px; padding: 10px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 5px;">
                <p th:text="${mensaje}" style="margin: 0;"></p>
            </div>

            <!-- errores de validacion de campos si existen -->
            <div th:if="${errores}" class="mensaje-error" style="display:block; margin-bottom: 15px; padding: 10px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 5px;">
                <ul style="margin: 5px 0; padding-left: 20px;">
                    <li th:each="error : ${errores}" th:text="${error.field + ': ' + error.defaultMessage}"></li>
                </ul>
            </div>

            <form th:action="@{/registro_cliente}" th:object="${clienteDTO}" method="POST">
                <!-- nombre -->
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required>
                </div>

                <!-- apellido -->
                <div class="form-group">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" th:field="*{apellido}" required>
                </div>

                <!-- direccion -->
                <div class="form-group">
                    <label for="direccion">Direccion:</label>
                    <input type="text" id="direccion" th:field="*{direccionUsuario}" required>
                </div>

                <!-- edad -->
                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" th:field="*{edad}" min="18" max="100" required>
                </div>

                <!-- numero de documento -->
                <div class="form-group">
                    <label for="numDocumento">Numero de Documento:</label>
                    <input type="number" id="numDocumento" th:field="*{numDocumento}" required>
                </div>

                <!-- telefono -->
                <div class="form-group">
                    <label for="telefono">Telefono:</label>
                    <input type="tel" id="telefono" th:field="*{telefono}" required>
                </div>

                <!-- correo electronico -->
                <div class="form-group">
                    <label for="correo">Correo Electronico:</label>
                    <input type="email" id="correo" th:field="*{correo}" required>
                </div>

                <!-- contrasena -->
                <div class="form-group">
                    <label for="password">Contrasena:</label>
                    <input type="password" id="password" th:field="*{password}" required>
                </div>

                <!-- boton de enviar -->
                <button type="submit" class="boton-registrarse">Registrarse</button>

                <!-- enlace a login -->
                <div class="enlace-login">
                    ya tienes una cuenta? <a th:href="@{/iniciar_sesion}">Inicia sesion aqui</a>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- pie de pagina -->
<footer>
    <div class="footer-container">
        <div class="footer-logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo" width="90">
        </div>

        <div class="footer-section">
            <h2>CONTACTANOS</h2>
            <a href="https://web.whatsapp.com/" target="_blank">3126204260</a>
            <a href="https://web.whatsapp.com/" target="_blank">3216942598</a>
        </div>

        <div class="footer-section">
            <h2>INFO SITIO</h2>
            <a href="#">Politica de la Empresa</a>
        </div>

        <div class="footer-section">
            <h2>SIGUENOS</h2>
            <div class="social-icons">
                <a href="https://es-la.facebook.com/index.php/" target="_blank">
                    <img th:src="@{/imagenes/inicio/facebook.jpg}" alt="Facebook" width="28">
                </a>
                <a href="https://www.instagram.com/" target="_blank">
                    <img th:src="@{/imagenes/inicio/instagram.jpg}" alt="Instagram" width="32">
                </a>
                <a href="https://www.youtube.com/" target="_blank">
                    <img th:src="@{/imagenes/inicio/youtube.jpg}" alt="YouTube" width="32">
                </a>
            </div>
        </div>
    </div>
</footer>

<!-- script javascript para el menu movil -->
<script th:src="@{/js/inicio/inicio.js}"></script>
<script th:src="@{/js/utils/validacion_registro_usuario.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // configuracion de ids para el formulario de cliente
        const configCliente = {
            nombreId: 'nombre',
            apellidoId: 'apellido',
            numDocumentoId: 'numDocumento',
            direccionId: 'direccion',
            edadId: 'edad',
            telefonoId: 'telefono',
            correoId: 'correo',
            passwordId: 'password'
        };
        inicializarValidacion('form', configCliente);
    });
</script>

</body>
</html>
