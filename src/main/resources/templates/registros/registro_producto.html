<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Agregar Producto - Eggs Gold</title>
    <link rel="icon" type="image/jpg" th:href="@{imagenes/inicio/logo.jpg}" />

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos base -->
    <link rel="stylesheet" th:href="@{css/conductor/conductor_inicio.css}" />
    <link rel="stylesheet" th:href="@{css/registros/registro_producto.css}" />
    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">

</head>

<body>

<!-- Sidebar -->
<nav id="sidebar">
    <ul>
        <li class="perfil-admin">
            <div class="avatar-contenedor" id="avatar-contenedor">
                <span id="avatar-iniciales">AD</span>
                <img id="avatar-imagen" src="" alt="Avatar" style="display: none;" />

                <input type="file" id="input-foto" accept="image/*" style="display: none;" />
            </div>
            <h2>Panel de Administración</h2>
        </li>
        <li><a th:href="@{/inventario}" class="nav-link"><i class="fas fa-home"></i> Regresar</a></li>
        <li><a th:href="@{/logout}" class="nav-link"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
    </ul>
</nav>

<!-- Contenido principal -->
<main id="main-content">
    <header>
        <div class="opciones">
            <div class="marca-contenedor">
                <div class="logo">
                    <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo de Eggs Gold">
                </div>

                <div class="marca-texto">
                    <h1 class="titulo">Eggs Gold</h1>
                    <p class="subtitulo">Huevos frescos a tu puerta</p>
                </div>
            </div>
            <h1 class="titulo2">Agregar nuevo producto</h1>
        </div>
    </header>

    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Formulario -->
    <!-- Formulario -->
    <form th:action="@{/registrar_producto}" th:object="${producto}" method="post"
          enctype="multipart/form-data" class="formulario-contenedor">

        <!-- ✅ ENCABEZADO CON BOTÓN CSV -->
        <div class="header-formulario">
            <h2>Formulario de creación</h2>
            <button type="button" class="btn-csv" id="btn-csv">
                <i class="fas fa-file-csv"></i> Cargar CSV
            </button>
        </div>

        <label for="nombre">Nombre del producto:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Huevo de campo" required oninvalid="this.setCustomValidity('El nombre del producto es obligatorio')" oninput="this.setCustomValidity('')">

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" th:field="*{descripcion}" placeholder="Agrega una breve descripción" required oninvalid="this.setCustomValidity('La descripción es obligatoria')" oninput="this.setCustomValidity('')"></textarea>

        <label for="precio">Precio:</label>
        <input type="number" id="precio" th:field="*{precio}" step="0.01" min="0.01" placeholder="Ej. 45.500" required oninvalid="this.setCustomValidity('El precio debe ser mayor a 0')" oninput="this.setCustomValidity('')">

        <label for="categoria_producto">Categoría:</label>
        <select id="categoria_producto" name="categoria" required oninvalid="this.setCustomValidity('Debes seleccionar una categoría')" oninput="this.setCustomValidity('')">
            <option value="">Selecciona una categoría</option>
            <option value="A">Huevos A</option>
            <option value="AA">Huevos AA</option>
            <option value="AAA">Huevos AAA</option>
        </select><br>

        <label for="imagenFile">Imagen del producto:</label>
        <input type="file" id="imagenFile" name="imagenFile" accept="image/*" required oninvalid="this.setCustomValidity('Debes seleccionar una imagen del producto')" oninput="this.setCustomValidity('')">

        <div class="preview-imagen">
            <img id="preview" alt="Vista previa de imagen">
        </div>

        <button type="submit" class="btn-guardar">
            Guardar Producto
        </button>
    </form>
</main>

<input type="file" id="input-csv" accept=".csv" style="display: none;">

<!-- ✅ Modal para mostrar resultados -->
<div id="modal-resultado" class="modal-resultado" style="display: none;">
    <div class="modal-contenido">
        <h3 id="modal-titulo">Resultado de la carga</h3>
        <p id="modal-mensaje"></p>
        <div id="modal-errores" style="display: none;">
            <h4>Errores encontrados:</h4>
            <ul id="lista-errores"></ul>
        </div>
        <button onclick="cerrarModal()" class="btn-cerrar-modal">Cerrar</button>
    </div>
</div>

<script th:src="@{/js/utils/foto_panel.js}"></script>
<script th:src="@{/js/administrador/registrar_producto.js}"></script>

<script th:src="@{/js/utils/manejo_sesion.js}"></script>
<script th:src="@{/js/utils/validacion_rol.js}"></script>
<script> validarRolPagina('ADMIN'); </script>

</body>
</html>
