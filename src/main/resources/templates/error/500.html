<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Servidor - Error 500</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/error/500.css}">
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-code">500</div>
        <h1 class="error-title">Error del Servidor</h1>
        <p class="error-message">
            Lo sentimos, ha ocurrido un error interno en el servidor.
            Nuestro equipo ha sido notificado y está trabajando para solucionarlo.
            Por favor, intenta nuevamente más tarde.
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-home">
                Volver al Inicio
            </a>
        </div>
    </div>
</div>
</body>
</html>
