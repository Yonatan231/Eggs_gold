<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado - Error 403</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/error/error.css}">
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-code">403</div>
        <h1 class="error-title">Acceso Denegado</h1>
        <p class="error-message">
            Lo sentimos, no tienes permisos para acceder a esta página.
            Esta área está restringida para usuarios con roles específicos.
        </p>

        <button class="btn btn-home" onclick="volver()">Volver</button>
    </div>
</div>

<script>
    function volver() {
        // Intentar volver a la página anterior
        if (history.length > 1) {
            history.back();
        } else {
            // Si no hay historial, ir al login
            window.location.href = '/login';
        }
    }
</script>

</body>
</html>
