<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página No Encontrada - Error 404</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/error/error.css}">
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Página No Encontrada</h1>
        <p class="error-message">
            Lo sentimos, la página que estás buscando no existe o ha sido movida.
            Verifica la URL o regresa a la página principal.
        </p>

        <button class="btn btn-home" onclick="volver()">Volver</button>
    </div>
</div>



<script>
    function volver() {
        if (history.length > 1) {
            history.back();
        } else {
            window.location.href = '/';
        }
    }
</script>

</body>
</html>
