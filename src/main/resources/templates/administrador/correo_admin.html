<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggs Gold - Envío de Correos Masivos</title>

    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS reutilizables -->
    <link rel="stylesheet" th:href="@{/css/utils/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/utils/header-responsive.css}">

    <!-- CSS especificos -->
    <link rel="stylesheet" th:href="@{/css/administrador/correo_administrador.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">
</head>

<body>

<!-- header responsive (solo movil) -->
<div class="header-responsive">
    <div class="header-content">
        <div class="header-logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo Eggs Gold">
        </div>
        <h1 class="header-title">
            Envío de Correos Masivos
        </h1>
        <button class="header-hamburger" aria-label="Abrir menú">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</div>

<!-- sidebar -->
<nav id="sidebar">
    <ul>
        <li class="perfil-admin">
            <div class="avatar-contenedor" id="avatar-contenedor">
                <span id="avatar-iniciales">AD</span>
                <img id="avatar-imagen" src="" alt="Foto de perfil" style="display: none;" />

                <label for="input-foto" class="boton-subir-foto" aria-label="Cambiar foto de perfil">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="input-foto" accept="image/*" style="display: none;" />
            </div>
            <h2>Panel de Administración</h2>
        </li>
        <li>
            <a th:href="@{/administrador_inicio}">
                <i class="fas fa-home"></i> Inicio
            </a>
        </li>
        <li>
            <a href="/logout" id="cerrar_sesion">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </a>
        </li>
    </ul>
</nav>

<!-- contenido principal -->
<main id="main-content">
    <!-- header desktop -->
    <header role="banner">
        <div class="opciones">
            <div class="marca-contenedor">
                <div class="logo">
                    <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo de Eggs Gold">
                </div>
                <div class="marca-texto">
                    <h1 class="titulo">Eggs Gold</h1>
                    <p class="subtitulo">Huevos frescos a tu puerta</p>
                </div>
            </div>
            <h1 class="titulo2">Envío de Correos Masivos</h1>
        </div>
    </header>

    <!-- formulario -->
    <section class="seccion-tabla" aria-labelledby="titulo-correos">
        <div class="encabezado-seccion">
            <h2 id="titulo-correos">Enviar Correos Masivos</h2>
            <p>Selecciona los roles destinatarios y redacta el mensaje que deseas enviar.</p>
        </div>

        <form id="correoForm" th:action="@{/correos/enviar}" method="post" class="form-envio-correos">

            <label>Seleccionar Roles Destinatarios:</label>
            <div class="roles-container">
                <div class="role-card selectable"
                     th:each="rol : ${roles}"
                     th:data-id="${rol.idRoles}"
                     th:data-nombre="${rol.nombreRol.toLowerCase()}">

                    <div class="icono-rol" th:switch="${rol.nombreRol.toLowerCase()}">
                        <i th:case="'administrador'" class="fas fa-crown"></i>
                        <i th:case="'logistica'" class="fas fa-boxes"></i>
                        <i th:case="'conductor'" class="fas fa-truck"></i>
                        <i th:case="'cliente'" class="fas fa-user"></i>
                        <i th:case="*" class="fas fa-user-circle"></i>
                    </div>

                    <p th:text="${rol.nombreRol}">Rol</p>
                </div>
            </div>

            <input type="hidden" id="rolIds" name="rolIds"/>

            <label for="asunto">Asunto del Correo:</label>
            <input type="text" id="asunto" name="asunto"
                   placeholder="Ej: Promociones de la semana" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="6"
                      placeholder="Escribe aquí el contenido del correo..." required></textarea>

            <div class="acciones-seccion">
                <button id="btnEnviarCorreos" type="submit" class="btn-enviar">
                    Enviar Correos
                </button>
            </div>

            <p th:if="${success}" style="color:green; font-weight:bold;" th:text="${success}"></p>
            <p th:if="${error}" style="color:red; font-weight:bold;" th:text="${error}"></p>
        </form>
    </section>
</main>

<!-- JS reutilizables -->
<script th:src="@{/js/utils/sidebar.js}"></script>

<!-- JS especificos -->
<script th:src="@{/js/administrador/correo_administrador.js}"></script>

<script th:src="@{/js/utils/manejo_sesion.js}"></script>
<script th:src="@{/js/utils/validacion_rol.js}"></script>
<script> validarRolPagina('ADMIN'); </script>

</body>
</html>
