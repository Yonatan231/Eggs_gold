<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrar Entrada de Stock - Eggs Gold</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}" />

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/utils/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/utils/header-responsive.css}">

    <link rel="stylesheet" th:href="@{/css/administrador/entrada_stock.css}" />
    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">
</head>

<body>

<div class="header-responsive">
    <div class="header-content">
        <div class="header-logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo Eggs Gold">
        </div>
        <h1 class="header-title">
            Entrada de Stock
        </h1>
        <button class="header-hamburger" aria-label="Abrir menú">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</div>

<nav id="sidebar">
    <ul>
        <li class="perfil-admin">
            <div class="avatar-contenedor" id="avatar-contenedor">
                <span id="avatar-iniciales">AD</span>
                <img id="avatar-imagen" src="" alt="Foto de perfil" style="display: none;" />

                <label for="input-foto" class="boton-subir-foto" aria-label="Cambiar foto de perfil">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="input-foto" accept="image/*" style="display: none;" />
            </div>
            <h2>Panel de Administración</h2>
        </li>
        <li>
            <a th:href="@{/inventario}">
                <i class="fas fa-home"></i> Regresar
            </a>
        </li>
        <li>
            <a href="/logout" id="cerrar_sesion">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </a>
        </li>
    </ul>
</nav>

<main id="main-content">
    <header role="banner">
        <div class="opciones">
            <div class="marca-contenedor">
                <div class="logo">
                    <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo de Eggs Gold">
                </div>
                <div class="marca-texto">
                    <h1 class="titulo">Eggs Gold</h1>
                    <p class="subtitulo">Huevos frescos a tu puerta</p>
                </div>
            </div>
            <h1 class="titulo2">Registrar Entrada de Stock</h1>
        </div>
    </header>

    <div id="mensaje-success" class="alert alert-success" style="display: none;"></div>
    <div id="mensaje-error" class="alert alert-error" style="display: none;"></div>

    <form id="entradaForm" class="formulario-contenedor">
        <div class="header-formulario">
            <h2>Formulario de entrada de inventario</h2>
            <button type="button" class="btn-csv" id="btn-csv">
                <i class="fas fa-file-csv"></i> Cargar CSV
            </button>
        </div>

        <label for="buscar-producto">Buscar producto:</label>
        <input type="text" id="buscar-producto" placeholder="Escribe para buscar..." autocomplete="off">

        <label for="producto">Producto:</label>
        <select id="producto" name="producto" required size="3">
        </select>

        <label for="cantidad">Cantidad (unidades):</label>
        <input type="number" id="cantidad" name="cantidad"
               min="1" placeholder="Ej. 100" required>

        <label for="proveedor">Proveedor:</label>
        <input type="text" id="proveedor" name="proveedor"
               placeholder="Nombre del proveedor" required>

        <button type="submit" class="btn-guardar">
            Registrar Entrada
        </button>
    </form>

    <input type="file" id="input-csv" accept=".csv" style="display: none;">

    <div id="modal-resultado" class="modal-resultado" style="display: none;">
        <div class="modal-contenido">
            <h3 id="modal-titulo">Resultado de la carga</h3>
            <p id="modal-mensaje"></p>
            <div id="modal-errores" style="display: none;">
                <h4>Errores encontrados:</h4>
                <ul id="lista-errores"></ul>
            </div>
            <button onclick="cerrarModal()" class="btn-cerrar-modal">Cerrar</button>
        </div>
    </div>
</main>

<script th:src="@{/js/utils/sidebar.js}"></script>

<script th:src="@{/js/administrador/entrada_stock.js}"></script>
<script th:src="@{/js/utils/manejo_sesion.js}"></script>
<script th:src="@{/js/utils/validacion_rol.js}"></script>
<script> validarRolPagina('ADMIN'); </script>

</body>
</html>
