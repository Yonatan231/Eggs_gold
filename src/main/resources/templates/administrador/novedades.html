<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades - Administrador</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="stylesheet" th:href="@{/css/administrador/novedades.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">
</head>
<body>


<!-- header fijo responsive -->
<header class="header-novedades">
    <div class="header-content">
        <div class="header-logo">
            <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo Eggs Gold">
        </div>


        <h1 class="header-title">Notificaciones</h1>


        <div class="header-actions">
            <form th:action="@{/administrador_inicio}">
                <button type="submit" class="btn-volver">
                    <span>←</span>
                </button>
            </form>
        </div>
    </div>
</header>


<div class="container">
    <!-- filtro por estado -->
    <div class="filter-container">
        <label for="filtroEstado">Filtrar por estado:</label>
        <select id="filtroEstado" class="filter-select">
            <option value="TODOS">Todos</option>
            <option value="PENDIENTE">Pendientes</option>
            <option value="RESUELTO">Resueltos</option>
        </select>
    </div>


    <!-- contenedor con scroll horizontal -->
    <div class="tabla-contenedor-scroll">
        <table id="tablaNovedades">
            <thead>
            <tr>
                <th>Código Pedido</th>
                <th>Tipo</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Fecha Creación</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Imagen</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="novedad : ${novedades}" th:attr="data-estado=${novedad.estado}">
                <td th:text="${novedad.pedido.idPedidos}"></td>
                <td th:text="${novedad.tipoNovedad}"></td>
                <td th:text="${novedad.descripcion}"></td>
                <td>
                   <span class="estado-badge"
                         th:classappend="${novedad.estado.name() == 'RESUELTO' ? 'estado-resuelto' : 'estado-pendiente'}"
                         th:text="${novedad.estado}">
                   </span>
                </td>
                <td th:text="${#temporals.format(novedad.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${novedad.usuario.nombre + ' ' + novedad.usuario.apellido}"></td>
                <td th:text="${novedad.usuario.rol.nombreRol}"></td>
                <td>
                    <button th:if="${novedad.imagen != null}"
                            class="btn-ver-imagen"
                            th:attr="data-imagen=${'/uploads/novedades/' + novedad.imagen}">
                        Ver
                    </button>
                    <span th:unless="${novedad.imagen != null}" class="sin-imagen">Sin imagen</span>
                </td>
                <td>
                    <select class="cambiar-estado" th:attr="data-id=${novedad.idNovedad}">
                        <option value="PENDIENTE" th:selected="${novedad.estado.name() == 'PENDIENTE'}">Pendiente</option>
                        <option value="RESUELTO" th:selected="${novedad.estado.name() == 'RESUELTO'}">Resuelto</option>
                    </select>
                </td>
            </tr>


            <tr th:if="${#lists.isEmpty(novedades)}" class="empty-row">
                <td colspan="9" class="empty-message">No hay novedades registradas</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>


<!-- lightbox para ver imagen -->
<div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" alt="Imagen de novedad">
</div>


<footer>
    <div class="footer-content">
        <p class="footer-quote">Cada gran negocio empieza con un buen producto.</p>
        <div class="footer-tags">
            <span class="tag">Innovación</span>
            <span class="tag">Calidad</span>
            <span class="tag">Confianza</span>
        </div>
        <div class="footer-copyright">
            © 2025 Sistema de Gestión de Productos - EGGS GOLD
        </div>
    </div>
</footer>


<script th:src="@{/js/utils/manejo_sesion.js}"></script>
<script th:src="@{/js/utils/validacion_rol.js}"></script>
<script th:src="@{/js/administrador/novedades.js}"></script>
<script> validarRolPagina('ADMIN'); </script>


</body>
</html>
