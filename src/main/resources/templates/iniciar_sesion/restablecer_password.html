<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contrasena</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}">

    <!-- Enlaces a archivos CSS -->
    <link rel="stylesheet" th:href="@{/css/iniciar_sesion/restablecer_password.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">
</head>
<body>
<!-- Contenedor principal -->
<div class="container">
    <!-- Encabezado con logo y titulo -->
    <header>
        <div class="header-content">
            <!-- Logo y nombre de la empresa -->
            <div class="marca">
                <div class="logo">
                    <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo Eggs Gold">
                </div>
            </div>

            <!-- Titulo del formulario -->
            <div class="header-text">
                <h1>Cambiar Contrasena</h1>
                <p>Actualiza tu contrasena de forma segura</p>
            </div>
        </div>
    </header>

    <!-- Seccion del formulario -->
    <div class="form-section">
        <!-- Mensaje de alerta para errores o exito -->
        <div id="alertMessage" class="alert"></div>

        <!-- Formulario de cambio de contrasena -->
        <form id="passwordForm">
            <!-- Campo oculto para el token -->
            <input type="hidden" id="token" th:value="${token}" />

            <!-- Campo: Nueva contrasena -->
            <div class="form-group">
                <label for="nuevaContrasena">Nueva Contrasena</label>
                <input type="password" id="nuevaContrasena" name="nuevaContrasena" required>
                <div class="help-text">Minimo 7 caracteres, debe contener letras y numeros</div>
            </div>

            <!-- Campo: Repetir contrasena -->
            <div class="form-group">
                <label for="repetirContrasena">Repetir Contrasena</label>
                <input type="password" id="repetirContrasena" name="repetirContrasena" required>
                <div class="help-text">Debe coincidir con la nueva contrasena</div>
            </div>

            <!-- Lista de validaciones -->
            <div class="validaciones">
                <h3>Requisitos de la contrasena:</h3>
                <ul>
                    <li id="validacion-longitud" class="invalido">Minimo 7 caracteres</li>
                    <li id="validacion-letras" class="invalido">Contiene letras</li>
                    <li id="validacion-numeros" class="invalido">Contiene numeros</li>
                    <li id="validacion-coincidencia" class="invalido">Las contrasenas coinciden</li>
                </ul>
            </div>

            <!-- Boton de envio -->
            <div class="form-actions">
                <button type="submit" class="btn btn-success">Cambiar Contrasena</button>
            </div>
        </form>
    </div>
</div>

<!-- Enlace al archivo JavaScript -->
<script th:src="@{/js/utils/restablecer_password.js}"></script>

</body>
</html>
