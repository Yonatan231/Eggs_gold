<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contrasena</title>
    <link rel="icon" type="image/jpg" th:href="@{/imagenes/inicio/logo.jpg}">

    <link rel="stylesheet" th:href="@{/css/iniciar_sesion/restablecer_password.css}">
    <link rel="stylesheet" th:href="@{/css/inicio/logo.css}">
</head>
<body>
<div class="container">
    <header>
        <div class="header-content">
            <div class="marca">
                <div class="logo">
                    <img th:src="@{/imagenes/inicio/logo.jpg}" alt="Logo Eggs Gold">
                </div>
            </div>

            <div class="header-text">
                <h1>Cambiar Contraseña</h1>
                <p>Actualiza tu contraseña de forma segura</p>
            </div>
        </div>
    </header>

    <div class="form-section">
        <div id="alertMessage" class="alert"></div>

        <form id="passwordForm">
            <input type="hidden" id="token" th:value="${token}" />

            <div class="form-group">
                <label for="nuevaContrasena">Nueva Contrasena</label>
                <input type="password" id="nuevaContrasena" name="nuevaContrasena" required>
                <div class="help-text">Mínimo 7 caracteres, debe contener letras y números</div>
            </div>

            <div class="form-group">
                <label for="repetirContrasena">Repetir Contraseña</label>
                <input type="password" id="repetirContrasena" name="repetirContrasena" required>
                <div class="help-text">Debe coincidir con la nueva contraseña</div>
            </div>

            <div class="validaciones">
                <h3>Requisitos de la contrasena:</h3>
                <ul>
                    <li id="validacion-longitud" class="invalido">Mínimo 7 caracteres</li>
                    <li id="validacion-letras" class="invalido">Contiene letras</li>
                    <li id="validacion-numeros" class="invalido">Contiene números</li>
                    <li id="validacion-coincidencia" class="invalido">Las contraseñas coinciden</li>
                </ul>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">Cambiar Contraseña</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/utils/restablecer_password.js}"></script>

</body>
</html>
