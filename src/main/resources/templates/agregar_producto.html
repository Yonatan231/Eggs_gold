<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Agregar Producto - Eggs Gold</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos base -->
    <link rel="stylesheet" href="css/administrador/administrador.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpg" href="imagenes/LOGO.jpg" />

    <style>
        /* === FORMULARIO MEJORADO === */
        body {
            background-color: #f4f6f8;
        }

        main {
            padding-bottom: 40px;
        }

        .formulario-contenedor {
            max-width: 700px;
            margin: 40px auto;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 35px 45px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .formulario-contenedor h2 {
            text-align: center;
            color: #AC9845FF;
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        label {
            margin-top: 15px;
            font-weight: 600;
            color: #333;
            display: block;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 6px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #AC9845FF;
            box-shadow: 0 0 6px rgba(0,120,215,0.3);
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .btn-guardar {
            margin-top: 25px;
            background-color: #AC9845FF;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        .btn-guardar:hover {
            background-color: #AC9845FF;
        }

        .preview-imagen {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }

        .preview-imagen img {
            max-width: 200px;
            border-radius: 8px;
            border: 1px solid #ccc;
            display: none;
        }

        .alert {
            max-width: 700px;
            margin: 20px auto;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .alert-success {
            background-color: #e8f7ee;
            color: #2e7d32;
            border: 1px solid #2e7d32;
        }

        .alert-error {
            background-color: #fdecea;
            color: #c62828;
            border: 1px solid #c62828;
        }

        header {
            background-color: white;
            border-bottom: 1px solid #ddd;
            padding: 20px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        header .titulo2 {
            color: #444;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header .titulo2 i {
            color: #AC9845FF;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<nav id="sidebar">
    <ul>
        <li class="perfil-admin">
            <div class="avatar-contenedor">
                <span id="avatar-iniciales">AD</span>
            </div>
            <h2>Panel de Administración</h2>
        </li>
        <li><a th:href="@{/administrador}" class="nav-link"><i class="fas fa-home"></i> Inicio</a></li>
        <li><a href="/logout" class="nav-link"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
    </ul>
</nav>

<!-- Contenido principal -->
<main id="main-content">
    <header>
        <div class="opciones">
            <img src="imagenes/LOGO.jpg" alt="Logo" class="logo">
            <h1 class="titulo2"><i class="fas fa-cart-plus"></i> Agregar nuevo producto</h1>
        </div>
    </header>

    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Formulario -->
    <form th:action="@{/agregar_producto}" th:object="${producto}" method="post"
          enctype="multipart/form-data" class="formulario-contenedor">

        <h2>Formulario de creación</h2>

        <label for="nombre">Nombre del producto:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Camiseta deportiva" required>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" th:field="*{descripcion}" placeholder="Agrega una breve descripción" required></textarea>

        <label for="precio">Precio:</label>
        <input type="number" id="precio" th:field="*{precio}" step="0.01" placeholder="Ej. 45.500" required>

        <label for="cantidad">Cantidad disponible:</label>
        <input type="number" id="cantidad" th:field="*{cantidad}" min="1" required>

        <label for="imagenFile">Imagen del producto:</label>
        <input type="file" id="imagenFile" name="imagenFile" accept="image/*">

        <div class="preview-imagen">
            <img id="preview" alt="Vista previa de imagen">
        </div>

        <button type="submit" class="btn-guardar">
            <i class="fas fa-save"></i> Guardar Producto
        </button>
    </form>
</main>

<script>
    // vista previa de imagen
    const inputFile = document.getElementById('imagenFile');
    const preview = document.getElementById('preview');

    inputFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = () => {
                preview.src = reader.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            preview.style.display = 'none';
        }
    });
</script>

</body>
</html>
