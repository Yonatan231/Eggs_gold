plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sena'
version = '0.0.1-SNAPSHOT'
description = 'aplicacion para controla una transportadora de huevos'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-mail'      // libreria para enviar correos
    implementation 'com.itextpdf:itextpdf:5.5.13.3'                         // libreria para el pdf de la factura
    implementation 'org.jfree:jfreechart:1.5.4'                             // libreria para graficas en PDF
    implementation 'org.mindrot:jbcrypt:0.4'                                // libreria para encriptar token de restablecimiento de password
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.github.librepdf:openpdf:1.3.30'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'



}


tasks.named('test') {
    useJUnitPlatform()
}