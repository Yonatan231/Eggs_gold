version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: eggs_gold_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bd_eggs_gold
      MYSQL_USER: eggs_user
      MYSQL_PASSWORD: eggs_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eggs_gold_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bd_eggs_gold?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: eggs_user
      SPRING_DATASOURCE_PASSWORD: eggs_pass
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
